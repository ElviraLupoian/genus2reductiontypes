<svg xmlns="http://www.w3.org/2000/svg"
     width="67.992pt"
     height="47.56pt"
     viewBox="0 0 67.992 47.56"
     preserveAspectRatio="xMidYMid meet">
  <g stroke="#000000"
     stroke-width="0.55"
     stroke-linecap="round"
     stroke-linejoin="round"
     fill="none">
    <!-- horizontal D-component and central triple point -->
    <line x1="7.5" y1="17.0" x2="60.5" y2="17.0"/>

    <!-- two upper diagonal branches -->
    <line x1="23.5" y1="5.5" x2="34.0" y2="17.0"/>
    <line x1="44.5" y1="5.5" x2="34.0" y2="17.0"/>

    <!-- descending diagonals, continuing through the lower components -->
    <line x1="34.0" y1="17.0" x2="11.5" y2="42.5"/>
    <line x1="34.0" y1="17.0" x2="56.5" y2="42.5"/>

    <!-- lower vertical components, crossed transversely -->
    <line x1="18.0" y1="28.5" x2="18.0" y2="45.0"/>
    <line x1="50.0" y1="28.5" x2="50.0" y2="45.0"/>
  </g>

  <g font-family="Times New Roman, Times, serif"
     font-size="8.5"
     fill="#0000FF">
    <text x="23.0" y="27.0">2</text>
    <text x="40.0" y="27.0">2</text>
    <text x="54.0" y="14.0">D</text>
  </g>
</svg>
